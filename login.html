<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a1f44" />
    <title>Sign in | Northstar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-card">
        <a class="login-brand" href="/" aria-label="Northstar home">
          <span class="brand-mark" aria-hidden="true">N</span>
          <span class="brand-name">northstar</span>
        </a>

        <header class="login-header">
          <h1 id="loginTitle">Hello!</h1>
          <p id="loginDescription">Sign in to your account</p>
        </header>

        <form class="auth-form" id="loginForm">
          <label>
            Username or email
            <input id="loginEmail" type="text" autocomplete="username" required />
          </label>
          <label>
            Password
            <input id="loginPassword" type="password" autocomplete="current-password" required />
          </label>

          <div class="auth-form-row">
            <button class="auth-toggle" id="togglePassword" type="button" aria-pressed="false">Show password</button>
            <button class="auth-toggle" id="passwordResetButton" type="button">Forgot password?</button>
          </div>

          <button class="auth-submit" id="loginSubmit" type="submit">Sign In</button>
          <p class="auth-message" id="loginMessage" role="status" aria-live="polite"></p>
        </form>

        <p class="login-footer">Don't have an account? Contact your Northstar account manager.</p>
        <p class="login-links">
          <a href="/information.html">Terms of Use</a>
          <span aria-hidden="true">·</span>
          <a href="/company.html">About Us</a>
        </p>
      </section>
    </main>
    <script type="module" src="/login.js"></script>
  </body>
</html>
